name: Auto Update README Papers

on:
  schedule:
    - cron: '0 2 */3 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    # Requires a self-hosted runner that has Ollama running locally.
    runs-on: self-hosted
    env:
      LLM_BACKEND: ollama
      OLLAMA_URL: http://127.0.0.1:11434/api/generate
      OLLAMA_MODEL: qwen3.5:35b-a3b-nvfp4
      AUTO_PUSH: '0'
      OLLAMA_TIMEOUT_SEC: '360'
      OLLAMA_RETRIES: '2'
      OLLAMA_BATCH_SIZE: '8'
      MAX_CANDIDATES: '48'
      MAX_ABS_TEXT_CHARS: '900'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check Ollama service and model
        run: |
          curl -fsS http://127.0.0.1:11434/api/tags > /tmp/ollama-tags.json
          if ! grep -q '"name":"'"${OLLAMA_MODEL}"'"' /tmp/ollama-tags.json; then
            echo "Model ${OLLAMA_MODEL} not found in local Ollama."
            echo "Please run on your runner: ollama pull ${OLLAMA_MODEL}"
            exit 1
          fi

      - name: Run automation script
        run: |
          python .local/auto_update_readme.py

      - name: Commit and push changes
        run: |
          if git diff --quiet -- README.md; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: auto-update literature list"
          git push origin HEAD:main
